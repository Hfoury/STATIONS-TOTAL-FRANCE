name: Découverte quotidienne des stations Total
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stations-osm
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_stations_osm.py
      - name: Publier le référentiel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stations_osm.json
          git diff --cached --quiet || (git commit -m "Découverte quotidienne des stations Total" && git push)
