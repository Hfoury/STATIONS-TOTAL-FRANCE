name: Découverte quotidienne des stations Total
on:
  push:
    paths:
      - "scripts/update_stations_geofabrik.py"
      - "requirements.txt"
      - ".github/workflows/decouverte-stations.yml"
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stations-osm
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_stations_geofabrik.py
      - name: Publier le référentiel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stations_osm.json
          if git diff --cached --quiet; then echo "Rien de nouveau à publier."; exit 0; fi
          git commit -m "Découverte quotidienne des stations Total"
          # L'autre workflow peut avoir publié entre-temps : on récupère main, on rejoue notre commit par-dessus, puis on renvoie.
          # Jamais d'envoi forcé : aucun commit de l'autre workflow n'est écrasé.
          for essai in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then echo "Publié (essai $essai)."; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 10))
          done
          echo "::error::Publication impossible après 5 essais."; exit 1
