name: Actualisation des prix Total
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Découverte quotidienne des stations Total"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: stations-prix
  cancel-in-progress: false
jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_prices.py
      - name: Publier les prix et le flux RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stations_total.json data/stations_total.csv data/flux.rss
          if git diff --cached --quiet; then echo "Rien de nouveau à publier."; exit 0; fi
          git commit -m "Actualisation des prix des carburants"
          # L'autre workflow peut avoir publié entre-temps : on récupère main, on rejoue notre commit par-dessus, puis on renvoie.
          # Jamais d'envoi forcé : aucun commit de l'autre workflow n'est écrasé.
          for essai in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then echo "Publié (essai $essai)."; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 10))
          done
          echo "::error::Publication impossible après 5 essais."; exit 1
